<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toponymy of Bengaluru</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --page:#f2f1ee;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --gridline:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
  --panel:rgba(252,252,251,.94);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --gridline:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
  --panel:rgba(26,26,25,.94);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --gridline:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
    --panel:rgba(26,26,25,.94);
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
     background:var(--page);color:var(--text-primary);overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface-1)}
.leaflet-container{background:var(--surface-1)}

#panel{position:absolute;top:16px;right:16px;width:340px;max-height:calc(100vh - 32px);
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--ring);
  border-radius:10px;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.hd{padding:16px 16px 12px;border-bottom:1px solid var(--gridline)}
h1{margin:0;font-size:17px;letter-spacing:-.01em}
.sub{color:var(--text-secondary);font-size:12px;margin-top:4px;line-height:1.5}
.sub b{color:var(--text-primary);font-variant-numeric:tabular-nums}

.row{display:flex;gap:6px;padding:12px 16px 0}
.seg{flex:1;display:flex;background:var(--gridline);border-radius:7px;padding:2px}
.seg button{flex:1;padding:7px 4px;border:0;background:none;border-radius:5px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--text-secondary)}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-primary);
  box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{border:1px solid var(--ring);background:var(--surface-1);color:var(--text-primary);
  border-radius:7px;cursor:pointer;font-size:13px;width:34px;flex:0 0 34px}

.body{overflow-y:auto;padding:12px 16px 16px}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-muted);margin:14px 0 8px}
.cap:first-child{margin-top:0}

/* ranked bars — replaces the 31-slice doughnut */
.bar{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;
  padding:3px 6px;border-radius:5px;cursor:pointer;margin:1px 0}
.bar:hover{background:var(--gridline)}
.bar[aria-selected="true"]{background:var(--gridline);outline:1px solid var(--baseline)}
.sw{width:12px;height:12px;border-radius:3px;box-shadow:0 0 0 1px var(--ring) inset}
.blabel{min-width:0}
.bname{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:5px;background:var(--gridline);border-radius:3px;margin-top:3px;overflow:hidden}
.bfill{display:block;height:100%;border-radius:3px}
.bval{font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.bmean{font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}

.foot{border-top:1px solid var(--gridline);padding:10px 16px;display:flex;gap:6px}
.foot button{flex:1;padding:8px;border:1px solid var(--ring);background:var(--surface-1);
  color:var(--text-primary);border-radius:6px;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600}
.foot button:hover{background:var(--gridline)}

.leaflet-popup-content-wrapper{background:var(--surface-1);color:var(--text-primary);
  border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.22)}
.leaflet-popup-tip{background:var(--surface-1)}
.pop b{font-size:14px}
.pop div{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.5}
.pop .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--gridline);
  color:var(--text-secondary);margin-top:6px}
#note{position:absolute;left:16px;bottom:16px;z-index:1000;max-width:330px;font-size:11px;
  color:var(--text-secondary);background:var(--panel);border:1px solid var(--ring);
  border-radius:8px;padding:9px 11px;line-height:1.55;backdrop-filter:blur(8px)}
@media(max-width:720px){
  #panel{left:12px;right:12px;width:auto;top:12px;max-height:56vh}
  #note{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="hd">
    <h1>Toponymy of Bengaluru</h1>
    <div class="sub" id="stats">Loading…</div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Colour by">
      <button id="v-lang" aria-pressed="true">Language</button>
      <button id="v-sem" aria-pressed="false">Meaning</button>
    </div>
    <button class="icon" id="theme" title="Toggle light / dark">◐</button>
  </div>
  <div class="body" id="legend"></div>
  <div class="foot">
    <button id="reset">Clear filter</button>
    <button id="csv">Download CSV</button>
  </div>
</div>

<div id="note"></div>

<script>
const $ = s => document.querySelector(s);
/* ?view=semantic|language and ?theme=light|dark make a view linkable */
const QS = new URLSearchParams(location.search);
if (QS.get("theme") === "light" || QS.get("theme") === "dark")
  document.documentElement.setAttribute("data-theme", QS.get("theme"));
let DATA, PAL, city, layer, markers = [],
    view = QS.get("view") === "semantic" ? "semantic" : "language",
    filter = null;

/* ---------- theme ---------- */
function mode(){
  const s = document.documentElement.getAttribute("data-theme");
  if (s) return s;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
const tiles = {
  light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
    {attribution:'&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',maxZoom:19}),
  dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
    {attribution:'&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',maxZoom:19})
};
let map = L.map("map",{zoomControl:false,preferCanvas:true}).setView([12.9716,77.5946],11);
L.control.zoom({position:"bottomright"}).addTo(map);
let baseLayer = null;
function applyBase(){
  const m = mode();
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = tiles[m].addTo(map);
  baseLayer.bringToBack();
}

/* ---------- colour ---------- */
function colourOf(f){
  const m = mode();
  if (view === "semantic") return PAL.semantic[m][f.sg] || PAL.semantic[m].unresolved;
  if (f.cf === "grey" || !PAL.shades[m][f.cf]) return PAL.family_base[m].grey;
  return PAL.shades[m][f.cf][f.sh];      // hue = family, shade = lemma (frozen at build)
}
/* key a feature belongs to under the current view */
const keyOf = f => view === "semantic" ? f.sg : f.lem;
const pretty = k => view === "semantic"
  ? ((PAL.semantic_label && PAL.semantic_label[k]) || k.replace(/_/g," "))
  : "-" + k;

/* ---------- render ---------- */
function draw(){
  if (layer) map.removeLayer(layer);
  markers = [];
  layer = L.layerGroup();
  city.neighborhoods.forEach(f => {
    const on = !filter || keyOf(f) === filter;
    const c = colourOf(f);
    const mk = L.circleMarker([f.lat,f.lon],{
      radius: on ? (filter ? 6 : 4.5) : 3,
      fillColor: c, fillOpacity: on ? .95 : .12,
      color: mode()==="dark" ? "#1a1a19" : "#fcfcfb",
      weight: on ? 1 : 0, opacity: on ? .9 : .12
    });
    mk.bindPopup(
      `<div class="pop"><b>${esc(f.n)}</b>
       <div><b style="color:${c}">-${esc(f.s)}</b> &nbsp;${esc(f.m)}</div>
       <div>${esc(f.l)} &middot; ${esc(pretty2(f.sc))}</div>
       <span class="tag">${esc(f.cn)}</span>${f.brand?' <span class="tag">builder-named</span>':''}</div>`);
    markers.push({f,mk});
    layer.addLayer(mk);
  });
  layer.addTo(map);
}
const pretty2 = k => k.replace(/_/g," ");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function legend(){
  const counts = {}, meta = {};
  city.neighborhoods.forEach(f=>{
    const k = keyOf(f);
    counts[k] = (counts[k]||0)+1;
    if(!meta[k]) meta[k] = f;
  });
  const keys = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const max = counts[keys[0]] || 1;
  const total = city.neighborhoods.length;

  const el = $("#legend");
  el.innerHTML = `<div class="cap">${view==="semantic"
      ? "What the name means ("+keys.length+" categories)"
      : "Suffix by language ("+keys.length+" suffixes)"}</div>`;

  keys.forEach(k=>{
    const f = meta[k], c = colourOf(f);
    const d = document.createElement("div");
    d.className="bar"; d.setAttribute("role","button"); d.tabIndex=0;
    d.setAttribute("aria-selected", filter===k ? "true":"false");
    d.innerHTML =
      `<span class="sw" style="background:${c}"></span>
       <span class="blabel">
         <div class="bname">${esc(pretty(k))}</div>
         <div class="btrack"><span class="bfill" style="width:${100*counts[k]/max}%;background:${c}"></span></div>
         <div class="bmean">${esc(view==="semantic" ? "" : (f.m||"")+" · "+(f.l||""))}</div>
       </span>
       <span class="bval">${counts[k]}<br><span style="color:var(--text-muted)">${(100*counts[k]/total).toFixed(1)}%</span></span>`;
    const go = ()=>{ filter = (filter===k? null : k); draw(); legend(); stats(); };
    d.onclick = go;
    d.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    el.appendChild(d);
  });

  /* In the grouped view, show which fine categories sit inside each group — the
     detail is in the data even though the hue is grouped. */
  if (view === "semantic"){
    const fine = {};
    city.neighborhoods.forEach(f=>{
      (fine[f.sg] = fine[f.sg] || {})[f.sc] = (fine[f.sg][f.sc]||0)+1;
    });
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="cap">Inside each group</div>` +
      Object.keys(fine).map(g=>{
        const parts = Object.entries(fine[g]).sort((a,b)=>b[1]-a[1])
          .map(([k,n])=>`${esc(k.replace(/_/g," "))} ${n}`).join(" &middot; ");
        return `<div class="bmean" style="margin:3px 0 6px">
          <span class="sw" style="display:inline-block;vertical-align:-1px;margin-right:5px;
            background:${PAL.semantic[mode()][g]}"></span>${parts}</div>`;
      }).join("");
    el.appendChild(wrap);
  }
}

function stats(){
  const t = city.neighborhoods.length;
  const un = city.neighborhoods.filter(f=>f.lem==="Other").length;
  const shown = filter ? city.neighborhoods.filter(f=>keyOf(f)===filter).length : t;
  $("#stats").innerHTML =
    `<b>${t}</b> neighbourhoods &middot; <b>${(100-100*un/t).toFixed(1)}%</b> classified`
    + (filter ? ` <br>Filtered to <b>${esc(pretty(filter))}</b> — ${shown} shown.` : "");
}

function note(){
  $("#note").innerHTML = view==="semantic"
    ? "<b>Meaning view.</b> Hue groups suffixes by what the name describes. Five groups, because colour stops being distinguishable past about seven. The finer category still shows in each popup and in the CSV."
    : "<b>Language view.</b> Hue is the root language family — <b>gold</b> Dravidian, <b>red</b> Indo-Aryan, <b>blue</b> English, <b>purple</b> Perso-Arabic. Shade separates suffixes inside a family; the legend and popup carry the identity.";
}

/* ---------- boot ---------- */
Promise.all([
  fetch("data.json").then(r=>r.json()),
  fetch("palette.json").then(r=>r.json())
]).then(([d,p])=>{
  DATA=d; PAL=p; city=d.cities[0];
  $("#v-lang").setAttribute("aria-pressed", view==="language");
  $("#v-sem").setAttribute("aria-pressed",  view==="semantic");
  applyBase(); draw(); legend(); stats(); note();
}).catch(e=>{ $("#stats").textContent = "Could not load data.json — serve this folder over HTTP."; console.error(e); });

$("#v-lang").onclick = ()=>setView("language");
$("#v-sem").onclick  = ()=>setView("semantic");
function setView(v){
  if(view===v) return;
  view=v; filter=null;
  $("#v-lang").setAttribute("aria-pressed", v==="language");
  $("#v-sem").setAttribute("aria-pressed",  v==="semantic");
  draw(); legend(); stats(); note();
}
$("#reset").onclick = ()=>{ filter=null; draw(); legend(); stats(); };
$("#theme").onclick = ()=>{
  document.documentElement.setAttribute("data-theme", mode()==="dark" ? "light":"dark");
  applyBase(); draw(); legend();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
  if(!document.documentElement.getAttribute("data-theme")){ applyBase(); draw(); legend(); }
});
$("#csv").onclick = ()=>{
  const rows = [["name","suffix","lemma","meaning","language","language_family","semantic_category","confidence","builder_named","lat","lon"]];
  city.neighborhoods.forEach(f=>rows.push([f.n,f.s,f.lem,f.m,f.l,f.lf,f.sc,f.cn,f.brand,f.lat,f.lon]));
  const csv = rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "Bengaluru_toponymy.csv"; a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
